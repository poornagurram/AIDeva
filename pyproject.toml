[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent"
version = "1.0.0"
description = "Autonomous, compliant X (Twitter) growth and monetization agent powered by Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.8,<2",
    "requests>=2.32",
    "requests-oauthlib>=2.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
xagent = "xagent.cli:main"

[tool.setuptools.packages.find]
include = ["xagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
